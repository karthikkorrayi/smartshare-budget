<div class="lock-screen" *ngIf="pinService.isLocked">
  <div class="lock-box">
    <p class="lock-brand">SmartShare Budget</p>
    <div class="lock-emblem" aria-hidden="true">💰</div>
    <h2>Enter 4-Digit PIN</h2>
    <p class="lock-hint">Your monthly money overview, one step away.</p>

    <!-- PIN INPUT -->
    <div class="pin-dots">
      <span *ngFor="let d of [0,1,2,3]; let i = index"
            [class.filled]="i < pin.length">
      </span>
    </div>

    <p class="error" role="alert" *ngIf="error">Invalid PIN</p>

    <!-- DIAL PAD -->
    <div class="dial-pad">
      <button *ngFor="let n of numbers" (click)="press(n)">
        {{ n }}
      </button>

      <span class="empty" aria-hidden="true"></span>

      <button (click)="press(0)">0</button>

      <button class="clear" aria-label="Remove last digit" (click)="remove()">⌫</button>
    </div>
    <p class="lock-footer">Use the keypad or your keyboard to continue.</p>
  </div>
</div>
