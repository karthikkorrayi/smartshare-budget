# Phase 7: deploys the app to Firebase Hosting (https://mybudgetapp-54c43.web.app) on every push to master.
# Runs ALONGSIDE the existing GitHub Pages deploy (deploy.yml) — nothing is replaced.
# Needs the repo secret FIREBASE_SERVICE_ACCOUNT_MYBUDGETAPP_54C43
# (created by: npx firebase-tools init hosting:github).
name: Deploy to Firebase Hosting

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npx ng build --configuration production   # base href "/" for web.app
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYBUDGETAPP_54C43 }}
          projectId: mybudgetapp-54c43
          channelId: live
